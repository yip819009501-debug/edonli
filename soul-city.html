<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测测你的灵魂老家在哪座城市</title><style>:root{--ink:#28384a;--accent:#c58969;--paper:#f2eee6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,var(--accent),var(--paper) 65%);color:var(--ink);font-family:"Songti SC",Georgia,serif}.wrap{max-width:760px;margin:auto;padding:20px}.panel{margin:35px auto;background:#fffd;border:1px solid #aa8;border-radius:24px;padding:clamp(24px,6vw,56px);box-shadow:0 18px 50px #0001}.ey{color:var(--accent);font:12px system-ui;letter-spacing:.15em}.orn{font-size:40px;color:var(--accent)}h1{font-size:clamp(30px,6vw,50px)}.btn,.opt{cursor:pointer;padding:15px;border-radius:14px}.btn{background:var(--ink);color:white;border:0}.opt{display:block;width:100%;margin:10px 0;text-align:left;border:1px solid #9998;background:transparent;color:var(--ink);font:15px system-ui}.opt:hover{background:#eee8}.bar{height:4px;background:#ddd}.bar i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border:1px solid #aaa7;border-radius:14px;line-height:1.8}.tag{border:1px solid var(--accent);border-radius:20px;padding:6px 10px;font:12px system-ui}footer{text-align:center;font:11px system-ui;opacity:.6}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:24px 18px}}</style><main class="wrap"><header>✦ 心意测试所 · 趣味自我探索</header><section class="panel" id="app"></section><footer>仅供轻松娱乐与自我探索，不构成专业评估</footer></main><script>const D={"title": "测测你的灵魂老家在哪座城市", "eyebrow": "沿着心意 · 城市气质", "sub": "不看地图，循着生活偏好找到灵魂栖居地。", "types": ["烟火成都", "温柔杭州", "自在大理", "浪漫厦门", "明快广州", "松弛苏州", "开阔青岛", "文艺南京"], "dims": ["热闹", "安稳", "审美", "远方"], "questions": ["周末在熟悉城市，你最想去哪？", "朋友推荐一条新街，你会怎样？", "来到陌生城市，你第一站选哪？", "地铁临时停运，你会怎么安排？", "挑选居住街区，你最看重什么？", "邻居遇到麻烦，你会怎样帮忙？", "忙碌一天后，你去哪儿放松？", "发现一家新店，你先看什么？", "和朋友选餐馆意见不同，你会？", "城市里什么画面最让你满足？", "面对复杂换乘，你会先做什么？", "社区活动需要帮手，你会负责？", "常走的小路封闭了，你会？", "你喜欢怎样的街坊聊天氛围？", "遇到喜欢的展览，你会如何逛？", "被店员误解需求，你会怎样说？", "城市里什么最吸引你留下？", "了解新城区，你会从哪里开始？", "朋友第一次来访，你带他去哪？", "在城市里独处，你最爱去哪？", "有机会搬去新城市，你会考虑？", "你最珍惜哪种邻里关系？", "城市生活遇到不便，你会怎样？", "朋友最常夸你会找什么地方？", "看到街区无障碍设施不足，你会？", "选择城市时，你最相信什么？", "发现社区新市集，你会怎样庆祝？", "你理想的城市周末是什么样？", "听到城市改造方案，你会？", "施工打断日常路线，你会怎样？", "你最容易记住城市的什么？", "搬家安顿好后，你会做什么？", "你希望别人怎样形容你的城市？", "通勤压力变大时，你会先做什么？", "收到老街店家的惊喜，你会？", "你最想改善城市生活的什么？", "理想的一天在城市哪里结束？", "你怎样表达对一座城的喜欢？", "你想在城市实现什么生活愿望？", "此刻最想听到城市对你说什么？"], "opts": ["先查清街区和路线信息", "优先考虑日常便利安稳", "关注街景、文化与氛围", "愿意尝试陌生远方"], "quote": "总有一方天地，让你自在生长。"};let n=0,A=[],app=document.querySelector('#app');function home(){n=0;A=[];app.innerHTML='<div class="ey">'+D.eyebrow+'</div><div class="orn">✧ ❋ ✧</div><h1>'+D.title+'</h1><p>'+D.sub+'</p><p>40 道生活化选择 · 8 种结果 · 约 3 分钟</p><button class="btn" onclick="question()">开始探索 →</button><p>凭第一感觉作答。结果仅供趣味参考。</p>'}function question(){app.innerHTML='<div class="ey">第 '+(n+1)+' 题 · 共 40 题</div><div class="bar"><i style="width:'+n/40*100+'%"></i></div><h2>'+D.questions[n]+'</h2>'+D.opts.map((x,i)=>'<button class="opt" onclick="pick('+i+')">'+x+'</button>').join('')+(n?'<button class="btn" onclick="n--;question()">上一题</button>':'')}function pick(i){A[n++]=i;n===40?result():question()}function result(){let s=[0,0,0,0];A.forEach(x=>s[x]++);let z=[0,1,2,3].sort((a,b)=>s[b]-s[a]||a-b),ix=(z[0]*2+(z[1]>z[0]?1:0))%8,r=D.types[ix],a=D.dims[z[0]],b=D.dims[z[1]];app.innerHTML='<div class="ey">你的探索结果</div><div class="orn">✦</div><span class="tag">'+a+' × '+b+'</span><h1>'+r+'</h1><p>“'+D.quote+'”</p><div class="grid"><div class="card"><b>性格特点</b><br>你有鲜明的'+a+'特质，也带着'+b+'底色；你会感受情境，再选择自己的步调。</div><div class="card"><b>匹配理由</b><br>「'+a+'」得分最高，「'+b+'」是次优势，这组偏好与你的结果气质相合。</div><div class="card"><b>隐藏优势</b><br>你能把'+a+'转化为行动，也借助'+b+'带来新方向。</div><div class="card"><b>趣味彩蛋</b><br>你会收到一枚写着「顺心而行」的小小信物。</div></div><p>'+D.dims.map((x,i)=>x+' '+s[i]).join('　·　')+'</p><p>评分：四个选项依次计入四个维度，每选中一次加 1 分；按最高及次高维度匹配，并列按固定顺序。趣味参考。</p><button class="btn" onclick="home()">重新测试</button> <button class="btn" onclick="print()">分享 / 保存</button>'}home()</script></html>
