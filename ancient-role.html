<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测测你在古代是什么身份</title><style>:root{--ink:#203631;--accent:#b78b55;--paper:#f1eadb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,var(--accent),var(--paper) 65%);color:var(--ink);font-family:"Songti SC",Georgia,serif}.wrap{max-width:760px;margin:auto;padding:20px}.panel{margin:35px auto;background:#fffd;border:1px solid #aa8;border-radius:24px;padding:clamp(24px,6vw,56px);box-shadow:0 18px 50px #0001}.ey{color:var(--accent);font:12px system-ui;letter-spacing:.15em}.orn{font-size:40px;color:var(--accent)}h1{font-size:clamp(30px,6vw,50px)}.btn,.opt{cursor:pointer;padding:15px;border-radius:14px}.btn{background:var(--ink);color:white;border:0}.opt{display:block;width:100%;margin:10px 0;text-align:left;border:1px solid #9998;background:transparent;color:var(--ink);font:15px system-ui}.opt:hover{background:#eee8}.bar{height:4px;background:#ddd}.bar i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border:1px solid #aaa7;border-radius:14px;line-height:1.8}.tag{border:1px solid var(--accent);border-radius:20px;padding:6px 10px;font:12px system-ui}footer{text-align:center;font:11px system-ui;opacity:.6}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:24px 18px}}</style><main class="wrap"><header>✦ 心意测试所 · 趣味自我探索</header><section class="panel" id="app"></section><footer>仅供轻松娱乐与自我探索，不构成专业评估</footer></main><script>const D={"title": "测测你在古代是什么身份", "eyebrow": "古卷 · 古代身份探索", "sub": "若生于千年前，你会把日子过成哪一种传奇？", "types": ["运筹帷幄的谋士", "定海安邦的主君", "落笔惊鸿的文士", "仗剑天涯的游侠", "披坚执锐的将领", "寄情山水的隐士", "洞察人心的使者", "治世有方的能臣"], "dims": ["谋略", "担当", "风雅", "自在"], "questions": ["遇到边关急报，你先做什么？", "君主征询意见，你会如何进言？", "朝堂意见相左，你会怎样周旋？", "百姓来陈情，你会先听什么？", "受命筹备大典，你先安排哪件事？", "盟友忽然改口，你会如何应对？", "发现账册有疑点，你会怎么查？", "远行前你会带上什么？", "有人邀你入仕，你最在意什么？", "遇到不平之事，你会如何出手？", "军情未明时，你会先做什么？", "被委以重任后，你会如何分工？", "政令临时更改，你会怎么安顿人心？", "夜宴之上，你最愿与谁交谈？", "得了一方闲暇，你会如何度过？", "遭人误解时，你会怎样自证？", "你最欣赏哪种治世之道？", "学习一门技艺，你会如何入门？", "友人陷入困境，你会怎样相助？", "远离尘嚣时，你最想去哪里？", "有一份新差事，你会怎样判断？", "你愿与怎样的人结交？", "谋划迟迟没有进展，你会如何调整？", "旁人最常因何来请教你？", "看到恃强凌弱，你会怎样做？", "要做大事时，你凭什么决断？", "小有功绩后，你会怎样庆贺？", "你理想中的行旅是什么样？", "听到新学说，你会如何看待？", "雅集被打断，你会如何反应？", "你最记得哪种人生故事？", "完成使命后，你最想做什么？", "你希望后人如何称呼你？", "身处危局时，你先稳住什么？", "收到故人来信，你会怎样回信？", "你最想改变当下哪种风气？", "一天公务结束后，你想做什么？", "你通常怎样表达忠义？", "你愿为怎样的理想奔走？", "此刻最想听到哪句劝勉？"], "opts": ["先梳理局势和利害", "主动担起责任并落实", "从人情与细节里找线索", "保留余地，随机应变"], "quote": "先谋后动，心有山海。"};let n=0,A=[],app=document.querySelector('#app');function home(){n=0;A=[];app.innerHTML='<div class="ey">'+D.eyebrow+'</div><div class="orn">✧ ❋ ✧</div><h1>'+D.title+'</h1><p>'+D.sub+'</p><p>40 道生活化选择 · 8 种结果 · 约 3 分钟</p><button class="btn" onclick="question()">开始探索 →</button><p>凭第一感觉作答。结果仅供趣味参考。</p>'}function question(){app.innerHTML='<div class="ey">第 '+(n+1)+' 题 · 共 40 题</div><div class="bar"><i style="width:'+n/40*100+'%"></i></div><h2>'+D.questions[n]+'</h2>'+D.opts.map((x,i)=>'<button class="opt" onclick="pick('+i+')">'+x+'</button>').join('')+(n?'<button class="btn" onclick="n--;question()">上一题</button>':'')}function pick(i){A[n++]=i;n===40?result():question()}function result(){let s=[0,0,0,0];A.forEach(x=>s[x]++);let z=[0,1,2,3].sort((a,b)=>s[b]-s[a]||a-b),ix=(z[0]*2+(z[1]>z[0]?1:0))%8,r=D.types[ix],a=D.dims[z[0]],b=D.dims[z[1]];app.innerHTML='<div class="ey">你的探索结果</div><div class="orn">✦</div><span class="tag">'+a+' × '+b+'</span><h1>'+r+'</h1><p>“'+D.quote+'”</p><div class="grid"><div class="card"><b>性格特点</b><br>你有鲜明的'+a+'特质，也带着'+b+'底色；你会感受情境，再选择自己的步调。</div><div class="card"><b>匹配理由</b><br>「'+a+'」得分最高，「'+b+'」是次优势，这组偏好与你的结果气质相合。</div><div class="card"><b>隐藏优势</b><br>你能把'+a+'转化为行动，也借助'+b+'带来新方向。</div><div class="card"><b>趣味彩蛋</b><br>你会收到一枚写着「顺心而行」的小小信物。</div></div><p>'+D.dims.map((x,i)=>x+' '+s[i]).join('　·　')+'</p><p>评分：四个选项依次计入四个维度，每选中一次加 1 分；按最高及次高维度匹配，并列按固定顺序。趣味参考。</p><button class="btn" onclick="home()">重新测试</button> <button class="btn" onclick="print()">分享 / 保存</button>'}home()</script></html>
