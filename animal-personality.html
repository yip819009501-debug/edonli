<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测测你是什么小动物人格</title><style>:root{--ink:#263a30;--accent:#8fb28c;--paper:#edf1e7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,var(--accent),var(--paper) 65%);color:var(--ink);font-family:"Songti SC",Georgia,serif}.wrap{max-width:760px;margin:auto;padding:20px}.panel{margin:35px auto;background:#fffd;border:1px solid #aa8;border-radius:24px;padding:clamp(24px,6vw,56px);box-shadow:0 18px 50px #0001}.ey{color:var(--accent);font:12px system-ui;letter-spacing:.15em}.orn{font-size:40px;color:var(--accent)}h1{font-size:clamp(30px,6vw,50px)}.btn,.opt{cursor:pointer;padding:15px;border-radius:14px}.btn{background:var(--ink);color:white;border:0}.opt{display:block;width:100%;margin:10px 0;text-align:left;border:1px solid #9998;background:transparent;color:var(--ink);font:15px system-ui}.opt:hover{background:#eee8}.bar{height:4px;background:#ddd}.bar i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border:1px solid #aaa7;border-radius:14px;line-height:1.8}.tag{border:1px solid var(--accent);border-radius:20px;padding:6px 10px;font:12px system-ui}footer{text-align:center;font:11px system-ui;opacity:.6}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:24px 18px}}</style><main class="wrap"><header>✦ 心意测试所 · 趣味自我探索</header><section class="panel" id="app"></section><footer>仅供轻松娱乐与自我探索，不构成专业评估</footer></main><script>const D={"title": "测测你是什么小动物人格", "eyebrow": "森林来信 · 动物人格", "sub": "如果心里住着一只小动物，它会怎样生活？", "types": ["灵动小狐狸", "治愈小水獭", "沉静猫头鹰", "自在小鹿", "忠诚小狗狗", "慢悠悠小熊", "敏锐小猫咪", "洒脱小海獭"], "dims": ["好奇", "温柔", "机敏", "自由"], "questions": ["周末来到林间，你最想去哪儿？", "伙伴发现浆果，你会如何回应？", "遇见陌生小动物，你会怎样靠近？", "天气忽然转凉，你会怎么准备？", "挑选自己的小窝，你最看重什么？", "伙伴受伤了，你会怎样帮忙？", "玩耍一天后，你怎样休息？", "发现树洞，你会先做什么？", "和伙伴抢到同一颗果子，你会？", "什么时刻最让你开心？", "森林里出现陌生脚印，你先？", "大家一起搬东西，你会做什么？", "回家的路被落叶盖住，你会？", "你最喜欢怎样和伙伴聊天？", "找到新玩具，你会玩多久？", "伙伴误会你时，你会怎么做？", "你最容易被什么声音吸引？", "学会攀爬或游泳，你怎么练习？", "朋友迷路时，你会如何帮忙？", "你喜欢在哪里晒太阳？", "森林深处有新路，你会走吗？", "你最珍惜哪种伙伴？", "藏好的坚果找不到了，你会？", "伙伴最常夸你的本领是什么？", "看到大动物欺负小动物，你会？", "选栖息地时，你凭什么判断？", "找到漂亮石子，你会怎么庆祝？", "理想的森林假期怎么过？", "遇到没见过的植物，你会？", "午睡被吵醒，你会怎样反应？", "你最容易记住哪种气味？", "完成筑巢后，你会做什么？", "你希望森林伙伴怎样记住你？", "听到雷声时，你先做什么？", "伙伴送你小礼物，你会怎样？", "你最想改善森林里的什么？", "森林夜晚怎样结束最安心？", "你通常怎样向伙伴示好？", "你最想和伙伴一起完成什么？", "此刻最想听到哪种呼唤？"], "opts": ["追着新线索四处看看", "先照顾伙伴的需要", "观察环境，判断安全", "想去哪就轻快出发"], "quote": "好奇心是森林的小小灯火。"};let n=0,A=[],app=document.querySelector('#app');function home(){n=0;A=[];app.innerHTML='<div class="ey">'+D.eyebrow+'</div><div class="orn">✧ ❋ ✧</div><h1>'+D.title+'</h1><p>'+D.sub+'</p><p>40 道生活化选择 · 8 种结果 · 约 3 分钟</p><button class="btn" onclick="question()">开始探索 →</button><p>凭第一感觉作答。结果仅供趣味参考。</p>'}function question(){app.innerHTML='<div class="ey">第 '+(n+1)+' 题 · 共 40 题</div><div class="bar"><i style="width:'+n/40*100+'%"></i></div><h2>'+D.questions[n]+'</h2>'+D.opts.map((x,i)=>'<button class="opt" onclick="pick('+i+')">'+x+'</button>').join('')+(n?'<button class="btn" onclick="n--;question()">上一题</button>':'')}function pick(i){A[n++]=i;n===40?result():question()}function result(){let s=[0,0,0,0];A.forEach(x=>s[x]++);let z=[0,1,2,3].sort((a,b)=>s[b]-s[a]||a-b),ix=(z[0]*2+(z[1]>z[0]?1:0))%8,r=D.types[ix],a=D.dims[z[0]],b=D.dims[z[1]];app.innerHTML='<div class="ey">你的探索结果</div><div class="orn">✦</div><span class="tag">'+a+' × '+b+'</span><h1>'+r+'</h1><p>“'+D.quote+'”</p><div class="grid"><div class="card"><b>性格特点</b><br>你有鲜明的'+a+'特质，也带着'+b+'底色；你会感受情境，再选择自己的步调。</div><div class="card"><b>匹配理由</b><br>「'+a+'」得分最高，「'+b+'」是次优势，这组偏好与你的结果气质相合。</div><div class="card"><b>隐藏优势</b><br>你能把'+a+'转化为行动，也借助'+b+'带来新方向。</div><div class="card"><b>趣味彩蛋</b><br>你会收到一枚写着「顺心而行」的小小信物。</div></div><p>'+D.dims.map((x,i)=>x+' '+s[i]).join('　·　')+'</p><p>评分：四个选项依次计入四个维度，每选中一次加 1 分；按最高及次高维度匹配，并列按固定顺序。趣味参考。</p><button class="btn" onclick="home()">重新测试</button> <button class="btn" onclick="print()">分享 / 保存</button>'}home()</script></html>
