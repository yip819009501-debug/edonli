<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测测你的恋爱人格</title><style>:root{--ink:#442d3b;--accent:#d98d98;--paper:#f8ecee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,var(--accent),var(--paper) 65%);color:var(--ink);font-family:"Songti SC",Georgia,serif}.wrap{max-width:760px;margin:auto;padding:20px}.panel{margin:35px auto;background:#fffd;border:1px solid #aa8;border-radius:24px;padding:clamp(24px,6vw,56px);box-shadow:0 18px 50px #0001}.ey{color:var(--accent);font:12px system-ui;letter-spacing:.15em}.orn{font-size:40px;color:var(--accent)}h1{font-size:clamp(30px,6vw,50px)}.btn,.opt{cursor:pointer;padding:15px;border-radius:14px}.btn{background:var(--ink);color:white;border:0}.opt{display:block;width:100%;margin:10px 0;text-align:left;border:1px solid #9998;background:transparent;color:var(--ink);font:15px system-ui}.opt:hover{background:#eee8}.bar{height:4px;background:#ddd}.bar i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border:1px solid #aaa7;border-radius:14px;line-height:1.8}.tag{border:1px solid var(--accent);border-radius:20px;padding:6px 10px;font:12px system-ui}footer{text-align:center;font:11px system-ui;opacity:.6}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:24px 18px}}</style><main class="wrap"><header>✦ 心意测试所 · 趣味自我探索</header><section class="panel" id="app"></section><footer>仅供轻松娱乐与自我探索，不构成专业评估</footer></main><script>const D={"title": "测测你的恋爱人格", "eyebrow": "心动来信 · 关系风格", "sub": "在靠近与保留之间，找到你的心动节奏。", "types": ["热烈直球派", "温柔陪伴派", "细腻共鸣派", "独立自在派", "可靠行动派", "浪漫想象派", "清醒守护派", "慢热深情派"], "dims": ["表达", "安定", "共情", "边界"], "questions": ["第一次约会，你最想安排什么？", "对方分享好消息，你会如何回应？", "刚开始心动时，你通常怎样表达？", "约会临时改期，你会怎么想？", "确定关系前，你最在意什么？", "伴侣低落时，你会如何陪伴？", "约会结束后，你怎样回味？", "想更了解对方，你会先聊什么？", "意见不合时，你希望怎样沟通？", "什么时刻最让你觉得被爱？", "对方工作忙碌，你会如何相处？", "两人做计划时，你通常负责什么？", "聊天突然冷场，你会怎么接话？", "你觉得舒服的亲密关系是什么样？", "收到喜欢的人讯息，你会怎样？", "被伴侣误会时，你会如何解释？", "你最容易被怎样的特质吸引？", "学习表达爱意，你会从哪开始？", "朋友恋爱遇到难题，你怎样支持？", "独处充电和约会，你怎样平衡？", "遇到心动对象，你会主动吗？", "你最珍惜恋爱中的什么时刻？", "关系进入平淡期，你会怎样经营？", "伴侣最常夸奖你哪一点？", "看到伴侣被不公平对待，你会？", "恋爱中的重要选择，你更信什么？", "平凡纪念日你想如何庆祝？", "理想的周末约会是什么样？", "听到伴侣不同看法，你会怎样？", "对方需要个人空间时，你会？", "你最容易记住哪次约会细节？", "一起完成目标后，你想做什么？", "你希望伴侣怎样形容你？", "关系出现压力时，你先做什么？", "收到意外礼物时，你会怎样？", "你最想改善恋爱中的什么？", "理想的一天如何和伴侣收尾？", "你通常怎样表达想念？", "你期待一起实现什么目标？", "此刻最想听伴侣说哪句话？"], "opts": ["坦率说出心意", "用稳定陪伴表达", "先理解对方感受", "说清自己的边界与节奏"], "quote": "认真，是最长久的心动。"};let n=0,A=[],app=document.querySelector('#app');function home(){n=0;A=[];app.innerHTML='<div class="ey">'+D.eyebrow+'</div><div class="orn">✧ ❋ ✧</div><h1>'+D.title+'</h1><p>'+D.sub+'</p><p>40 道生活化选择 · 8 种结果 · 约 3 分钟</p><button class="btn" onclick="question()">开始探索 →</button><p>凭第一感觉作答。结果仅供趣味参考。</p>'}function question(){app.innerHTML='<div class="ey">第 '+(n+1)+' 题 · 共 40 题</div><div class="bar"><i style="width:'+n/40*100+'%"></i></div><h2>'+D.questions[n]+'</h2>'+D.opts.map((x,i)=>'<button class="opt" onclick="pick('+i+')">'+x+'</button>').join('')+(n?'<button class="btn" onclick="n--;question()">上一题</button>':'')}function pick(i){A[n++]=i;n===40?result():question()}function result(){let s=[0,0,0,0];A.forEach(x=>s[x]++);let z=[0,1,2,3].sort((a,b)=>s[b]-s[a]||a-b),ix=(z[0]*2+(z[1]>z[0]?1:0))%8,r=D.types[ix],a=D.dims[z[0]],b=D.dims[z[1]];app.innerHTML='<div class="ey">你的探索结果</div><div class="orn">✦</div><span class="tag">'+a+' × '+b+'</span><h1>'+r+'</h1><p>“'+D.quote+'”</p><div class="grid"><div class="card"><b>性格特点</b><br>你有鲜明的'+a+'特质，也带着'+b+'底色；你会感受情境，再选择自己的步调。</div><div class="card"><b>匹配理由</b><br>「'+a+'」得分最高，「'+b+'」是次优势，这组偏好与你的结果气质相合。</div><div class="card"><b>隐藏优势</b><br>你能把'+a+'转化为行动，也借助'+b+'带来新方向。</div><div class="card"><b>趣味彩蛋</b><br>你会收到一枚写着「顺心而行」的小小信物。</div></div><p>'+D.dims.map((x,i)=>x+' '+s[i]).join('　·　')+'</p><p>评分：四个选项依次计入四个维度，每选中一次加 1 分；按最高及次高维度匹配，并列按固定顺序。趣味参考。</p><button class="btn" onclick="home()">重新测试</button> <button class="btn" onclick="print()">分享 / 保存</button>'}home()</script></html>
