<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测测你的隐藏天赋是什么</title><style>:root{--ink:#202e4c;--accent:#9994d1;--paper:#f0eff9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,var(--accent),var(--paper) 65%);color:var(--ink);font-family:"Songti SC",Georgia,serif}.wrap{max-width:760px;margin:auto;padding:20px}.panel{margin:35px auto;background:#fffd;border:1px solid #aa8;border-radius:24px;padding:clamp(24px,6vw,56px);box-shadow:0 18px 50px #0001}.ey{color:var(--accent);font:12px system-ui;letter-spacing:.15em}.orn{font-size:40px;color:var(--accent)}h1{font-size:clamp(30px,6vw,50px)}.btn,.opt{cursor:pointer;padding:15px;border-radius:14px}.btn{background:var(--ink);color:white;border:0}.opt{display:block;width:100%;margin:10px 0;text-align:left;border:1px solid #9998;background:transparent;color:var(--ink);font:15px system-ui}.opt:hover{background:#eee8}.bar{height:4px;background:#ddd}.bar i{display:block;height:100%;background:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px;border:1px solid #aaa7;border-radius:14px;line-height:1.8}.tag{border:1px solid var(--accent);border-radius:20px;padding:6px 10px;font:12px system-ui}footer{text-align:center;font:11px system-ui;opacity:.6}@media(max-width:550px){.grid{grid-template-columns:1fr}.panel{padding:24px 18px}}</style><main class="wrap"><header>✦ 心意测试所 · 趣味自我探索</header><section class="panel" id="app"></section><footer>仅供轻松娱乐与自我探索，不构成专业评估</footer></main><script>const D={"title": "测测你的隐藏天赋是什么", "eyebrow": "灵感显影 · 天赋发现", "sub": "那些你觉得顺手的事，或许正是独特的光。", "types": ["看见本质的洞察者", "点亮新意的创造者", "凝聚人心的连接者", "把想法落地的行动派", "搭建秩序的规划师", "讲述故事的表达者", "敏锐共情的观察家", "持续精进的探索者"], "dims": ["洞察", "创造", "连接", "行动"], "questions": ["接到一个模糊任务，你先做什么？", "同事提出新点子，你会如何回应？", "加入新项目组，你通常怎么融入？", "需求临时改变，你会如何调整？", "做决定前你最想补齐什么信息？", "同伴卡住时，你会怎么帮忙？", "完成高强度工作后，你怎么恢复？", "开始新项目，你通常先搭什么？", "团队意见冲突，你会怎样推动？", "哪种成果最让你有成就感？", "面对复杂信息，你会先做什么？", "团队中你自然承担哪类角色？", "原定方案失效时，你会怎样？", "什么样的讨论最能激发你？", "遇到感兴趣的问题，你会钻研多久？", "别人误读你的方案，你会怎样说明？", "你最容易发现哪类机会？", "学工具或方法时，你怎么上手？", "同事要做选择，你如何协助？", "工作之外你怎样补充能量？", "面对陌生挑战，你怎样评估？", "你最珍惜哪种合作关系？", "项目进展停滞，你如何推进？", "别人最常请你帮忙做什么？", "发现流程对人不公平，你会？", "复杂选择中你最信赖什么依据？", "一个小里程碑完成后，你怎样庆祝？", "你理想的工作日如何安排？", "听到反对意见，你会怎样吸收？", "专注时被打断，你会如何恢复？", "你最容易从数据中看见什么？", "完成交付后，你会先检查什么？", "你希望团队如何形容你的贡献？", "压力上来时，你先稳定什么？", "收到正向反馈，你会怎样回应？", "你最想改善团队工作的什么？", "理想工作日的最后一小时做什么？", "你通常怎样让协作对象安心？", "你想用能力解决哪类问题？", "此刻最想听到哪句职业鼓励？"], "opts": ["拆解问题，找出规律", "提出新方法或新点子", "了解相关人的需要", "马上试做并迭代"], "quote": "天赋藏在做得自然的事里。"};let n=0,A=[],app=document.querySelector('#app');function home(){n=0;A=[];app.innerHTML='<div class="ey">'+D.eyebrow+'</div><div class="orn">✧ ❋ ✧</div><h1>'+D.title+'</h1><p>'+D.sub+'</p><p>40 道生活化选择 · 8 种结果 · 约 3 分钟</p><button class="btn" onclick="question()">开始探索 →</button><p>凭第一感觉作答。结果仅供趣味参考。</p>'}function question(){app.innerHTML='<div class="ey">第 '+(n+1)+' 题 · 共 40 题</div><div class="bar"><i style="width:'+n/40*100+'%"></i></div><h2>'+D.questions[n]+'</h2>'+D.opts.map((x,i)=>'<button class="opt" onclick="pick('+i+')">'+x+'</button>').join('')+(n?'<button class="btn" onclick="n--;question()">上一题</button>':'')}function pick(i){A[n++]=i;n===40?result():question()}function result(){let s=[0,0,0,0];A.forEach(x=>s[x]++);let z=[0,1,2,3].sort((a,b)=>s[b]-s[a]||a-b),ix=(z[0]*2+(z[1]>z[0]?1:0))%8,r=D.types[ix],a=D.dims[z[0]],b=D.dims[z[1]];app.innerHTML='<div class="ey">你的探索结果</div><div class="orn">✦</div><span class="tag">'+a+' × '+b+'</span><h1>'+r+'</h1><p>“'+D.quote+'”</p><div class="grid"><div class="card"><b>性格特点</b><br>你有鲜明的'+a+'特质，也带着'+b+'底色；你会感受情境，再选择自己的步调。</div><div class="card"><b>匹配理由</b><br>「'+a+'」得分最高，「'+b+'」是次优势，这组偏好与你的结果气质相合。</div><div class="card"><b>隐藏优势</b><br>你能把'+a+'转化为行动，也借助'+b+'带来新方向。</div><div class="card"><b>趣味彩蛋</b><br>你会收到一枚写着「顺心而行」的小小信物。</div></div><p>'+D.dims.map((x,i)=>x+' '+s[i]).join('　·　')+'</p><p>评分：四个选项依次计入四个维度，每选中一次加 1 分；按最高及次高维度匹配，并列按固定顺序。趣味参考。</p><button class="btn" onclick="home()">重新测试</button> <button class="btn" onclick="print()">分享 / 保存</button>'}home()</script></html>
